# Sidekiq configuration for thin.ly
:concurrency: 10
:timeout: 25
:verbose: false
:max_retries: 3

# Queue priority order (first = highest priority)
:queues:
  - default
  - safe_browsing
  - mailers

production:
  :concurrency: 10
  :verbose: false

development:
  :concurrency: 2
  :verbose: true

test:
  :concurrency: 1